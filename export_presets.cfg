; Godot export presets — checked into the repo.
; Real keystore path/credentials are NEVER committed here. The release
; job in .github/workflows/android-build.yml sed-substitutes the
; __KEYSTORE_RELEASE_*__ tokens below from GitHub Secrets at build time.
; Copy this file to export_presets.cfg (which stays gitignored-safe because
; it will only ever contain these same placeholder tokens locally too —
; you inject your own local keystore path by hand when exporting from the
; Godot editor on your own machine, and just don't commit that local edit).

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/release/wardkeep.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=1 ; 1 = AAB
package/unique_name="com.wardkeep.game"
package/name="WARDKEEP"
package/signed=true
keystore/debug=""                                  ; leave blank; Godot uses its built-in debug keystore for --export-debug
keystore/debug_user=""
keystore/debug_password=""
keystore/release="__KEYSTORE_RELEASE_PATH__"
keystore/release_user="__KEYSTORE_RELEASE_USER__"
keystore/release_password="__KEYSTORE_RELEASE_PASSWORD__"
version/code=1                                     ; bump per release build, see SETUP.md
version/name="0.1.0"
screen/orientation="portrait"
