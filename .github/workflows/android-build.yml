          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import project (generates .godot cache)
        run: godot --headless --verbose --import

      - name: Export release AAB
        run: |
          mkdir -v -p build/release
          godot --headless --verbose --install-android-build-template \
            --export-release "Android" build/release/wardkeep.aab

      - name: Upload release AAB as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardkeep-release-aab-${{ github.sha }}
          path: build/release/wardkeep.aab
          retention-days: 90

      - name: Attach release AAB to a full release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "Release build ${{ github.run_number }} (${{ github.sha }})"
          prerelease: false
          files: build/release/wardkeep.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
