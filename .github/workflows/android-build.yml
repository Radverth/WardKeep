name: Android Build (Test APK -> Approved Release AAB)

# Push to main builds a debug test APK immediately and attaches it to a
# pre-release GitHub Release for you to download and install on a device.
# The release AAB job is gated behind the "play-release" GitHub Environment
# (Settings -> Environments -> play-release -> Required reviewers). It will
# NOT run until you approve it in the Actions tab, so nothing gets built for
# Play Console upload without your sign-off on the test APK first.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you re-run either job manually if needed

env:
  GODOT_VERSION: "4.3"    # pin to the exact Godot version the project uses

jobs:
  test:
    name: Unit suites + headless playtest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: barichello/godot-ci:4.3   # match GODOT_VERSION above
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import project (generates .godot cache)
        run: godot --headless --import

      - name: Unit suites
        run: godot --headless res://tests/Tests.tscn

      # Boots a real Arena and plays it to the wave-10 boss fight. Catches
      # regressions that only appear once enemies are actually walking.
      - name: Headless playtest
        run: godot --headless res://tests/Playtest.tscn -- --waves 12

  build-test-apk:
    name: Build debug test APK
    needs: test
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates a Release, which GITHUB_TOKEN can
    # only do with write access. Repos whose default workflow permission is
    # read-only would otherwise fail this job with a 403.
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.3   # match GODOT_VERSION above
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Godot will not export for Android until three things it keeps in
      # *editor settings* are set: a JDK, the Android SDK, and a debug
      # keystore. None of them are project files, and none carry over from the
      # image: GitHub Actions sets HOME=/github/home inside a container, so
      # Godot never reads the settings the image wrote to /root. Write them
      # where this Godot will actually look, and generate the debug keystore.
      - name: Configure the Android toolchain
        run: |
          echo "HOME=$HOME"
          JAVA_SDK="${JAVA_HOME:-}"
          if [ -z "$JAVA_SDK" ] && command -v javac >/dev/null; then
            JAVA_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          for candidate in /usr/lib/android-sdk /opt/android-sdk /root/android-sdk; do
            [ -n "$ANDROID_SDK" ] && break
            [ -d "$candidate" ] && ANDROID_SDK="$candidate"
          done
          echo "Java SDK:    ${JAVA_SDK:-<not found>}"
          echo "Android SDK: ${ANDROID_SDK:-<not found>}"
          if [ -z "$JAVA_SDK" ] || [ -z "$ANDROID_SDK" ]; then
            echo "::error::Android export needs a JDK and the Android SDK in the build image."
            echo "Diagnostics follow so the next run does not have to guess:"
            command -v java javac keytool gradle || true
            ls -d /usr/lib/jvm/* /opt/android* /usr/lib/android* 2>/dev/null || true
            env | grep -iE 'java|android' || true
            exit 1
          fi
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")" "$HOME/.config/godot"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -storepass android -keystore "$KEYSTORE" \
              -validity 9999 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # The filename carries the minor version - 4.3 does not read
          # editor_settings-4.tres. Godot merges the rest of the defaults in.
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import project (generates .godot cache)
        run: godot --headless --verbose --import

      - name: Export debug APK
        run: |
          mkdir -v -p build/test
          godot --headless --verbose --install-android-build-template \
            --export-debug "Android Test" build/test/wardkeep-test.apk || {
            echo "::group::export diagnostics"
            ls -la android android/build 2>/dev/null || echo "no android/ build template in the project"
            cat android/build/.build_version 2>/dev/null || echo "no .build_version"
            ls ~/.local/share/godot/export_templates/ 2>/dev/null || echo "no export templates under HOME"
            echo "::endgroup::"
            exit 1
          }

      - name: Upload test APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardkeep-test-apk-${{ github.sha }}
          path: build/test/wardkeep-test.apk
          retention-days: 30

      - name: Attach test APK to a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: "Test build ${{ github.run_number }} (${{ github.sha }})"
          prerelease: true
          files: build/test/wardkeep-test.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-aab:
    name: Build signed release AAB (Play Console upload)
    needs: build-test-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: play-release   # <-- the approval gate lives here
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Decode release keystore
        run: |
          mkdir -v -p /root/keystore
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > /root/keystore/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Inject keystore path + credentials into export_presets.cfg
        # export_presets.cfg is checked into the repo with placeholder tokens
        # (see export_presets.cfg.example in this repo). Godot has no
        # separate "local override" file for export presets, so the
        # documented CI pattern is to sed the real values in at build time
        # and never commit them.
        run: |
          sed -i "s|__KEYSTORE_RELEASE_PATH__|/root/keystore/release.keystore|" export_presets.cfg
          sed -i "s|__KEYSTORE_RELEASE_USER__|${ANDROID_KEY_ALIAS}|" export_presets.cfg
          sed -i "s|__KEYSTORE_RELEASE_PASSWORD__|${ANDROID_KEY_PASSWORD}|" export_presets.cfg
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Godot will not export for Android until three things it keeps in
      # *editor settings* are set: a JDK, the Android SDK, and a debug
      # keystore. None of them are project files, and none carry over from the
      # image: GitHub Actions sets HOME=/github/home inside a container, so
      # Godot never reads the settings the image wrote to /root. Write them
      # where this Godot will actually look, and generate the debug keystore.
      - name: Configure the Android toolchain
        run: |
          echo "HOME=$HOME"
          JAVA_SDK="${JAVA_HOME:-}"
          if [ -z "$JAVA_SDK" ] && command -v javac >/dev/null; then
            JAVA_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          for candidate in /usr/lib/android-sdk /opt/android-sdk /root/android-sdk; do
            [ -n "$ANDROID_SDK" ] && break
            [ -d "$candidate" ] && ANDROID_SDK="$candidate"
          done
          echo "Java SDK:    ${JAVA_SDK:-<not found>}"
          echo "Android SDK: ${ANDROID_SDK:-<not found>}"
          if [ -z "$JAVA_SDK" ] || [ -z "$ANDROID_SDK" ]; then
            echo "::error::Android export needs a JDK and the Android SDK in the build image."
            echo "Diagnostics follow so the next run does not have to guess:"
            command -v java javac keytool gradle || true
            ls -d /usr/lib/jvm/* /opt/android* /usr/lib/android* 2>/dev/null || true
            env | grep -iE 'java|android' || true
            exit 1
          fi
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")" "$HOME/.config/godot"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -storepass android -keystore "$KEYSTORE" \
              -validity 9999 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # The filename carries the minor version - 4.3 does not read
          # editor_settings-4.tres. Godot merges the rest of the defaults in.
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import project (generates .godot cache)
        run: godot --headless --verbose --import

      - name: Export release AAB
        run: |
          mkdir -v -p build/release
          godot --headless --verbose --install-android-build-template \
            --export-release "Android" build/release/wardkeep.aab

      - name: Upload release AAB as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardkeep-release-aab-${{ github.sha }}
          path: build/release/wardkeep.aab
          retention-days: 90

      - name: Attach release AAB to a full release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "Release build ${{ github.run_number }} (${{ github.sha }})"
          prerelease: false
          files: build/release/wardkeep.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
