            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager in the image - fetching the command line tools."
            curl -sSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline && mkdir -p /tmp/cmdline
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline
            mkdir -p "$ANDROID_SDK/cmdline-tools"
            rm -rf "$ANDROID_SDK/cmdline-tools/latest"
            mv /tmp/cmdline/cmdline-tools "$ANDROID_SDK/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" \
